<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>KeepAliveMC Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 24px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { font-size: 1.5rem; margin-bottom: 16px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    label { font-size: 0.85rem; color: #94a3b8; display: flex; flex-direction: column; gap: 4px; }
    input, select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    .actions { display: flex; gap: 10px; margin-bottom: 16px; }
    button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.stop { background: #dc2626; }
    button.stop:hover { background: #b91c1c; }
    #console { background: #020617; border: 1px solid #334155; border-radius: 6px; height: 350px; padding: 12px; overflow-y: auto; font-family: monospace; font-size: 0.9rem; color: #38bdf8; white-space: pre-wrap; margin-bottom: 12px; }
    .chat-box { display: flex; gap: 8px; }
    .chat-box input { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎮 KeepAliveMC Manager</h2>
    
    <div class="grid">
      <label>عنوان الخادم (IP): <input id="ip" placeholder="play.example.com" /></label>
      <label>المنفذ (Port): <input id="port" value="25565" type="number" /></label>
      <label>إصدار اللعبة:
        <select id="version">
          <option value="">تلقائي (Auto Detect)</option>
          <option value="1.20.4" selected>1.20.4</option>
          <option value="1.19.4">1.19.4</option>
          <option value="1.16.5">1.16.5</option>
          <option value="1.12.2">1.12.2</option>
          <option value="1.8.9">1.8.9</option>
        </select>
      </label>
      <label>اسم البوت: <input id="username" placeholder="Bot_KeepAlive" /></label>
      <label>نوع الحساب:
        <select id="auth">
          <option value="offline" selected>مكرك (Offline)</option>
          <option value="microsoft">أصلي (Microsoft)</option>
        </select>
      </label>
      <label>مفتاح API Key: <input id="apiKey" type="password" placeholder="x-api-key" /></label>
    </div>

    <div class="actions">
      <button id="sendBtn">تشغيل البوت</button>
      <button id="stopBtn" class="stop" disabled>إيقاف البوت</button>
    </div>

    <div id="console">[system] بانتظار الاتصال...</div>

    <div class="chat-box">
      <input id="cmd" placeholder="اكتب أمرًا أو رسالة..." />
      <button id="sendMsg">إرسال</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const API_BASE = window.location.origin.includes('localhost') 
      ? 'http://localhost:3000' 
      : 'https://keepalivemc-production.up.railway.app';

    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const consoleEl = document.getElementById('console');
    let sessionId = null;
    let socket = null;

    function log(text) {
      consoleEl.textContent += '\n' + text;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    sendBtn.onclick = async () => {
      const host = document.getElementById('ip').value.trim();
      const port = document.getElementById('port').value;
      const version = document.getElementById('version').value || undefined;
      const username = document.getElementById('username').value.trim() || undefined;
      const auth = document.getElementById('auth').value;
      const key = document.getElementById('apiKey').value.trim();

      if (!host || !key) return alert('يرجى كتابة IP ومفتاح API Key');

      try {
        const res = await fetch(`${API_BASE}/api/spawn`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': key },
          body: JSON.stringify({ host, port, version, username, auth })
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل الاتصال');

        sessionId = data.sessionId;
        log(`[system] تم بدء الجلسة: ${sessionId}`);
        setupSocket(sessionId);
        sendBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (e) {
        alert(`خطأ: ${e.message}`);
      }
    };

    stopBtn.onclick = async () => {
      const key = document.getElementById('apiKey').value.trim();
      if (!sessionId) return;

      try {
        await fetch(`${API_BASE}/api/stop/${sessionId}`, {
          method: 'POST',
          headers: { 'x-api-key': key }
        });
        log(`[system] تم إيقاف الجلسة.`);
      } catch (e) {
        log(`[system] خطأ أثناء الإيقاف: ${e.message}`);
      }

      if (socket) socket.disconnect();
      sessionId = null;
      sendBtn.disabled = false;
      stopBtn.disabled = true;
    };

    function setupSocket(id) {
      socket = io(`${API_BASE}/session-${id}`, { transports: ['websocket'] });
      socket.on('connect', () => log('[socket] متصل بالخادم'));
      socket.on('log', (m) => log(m));
      socket.on('chat', (d) => log(`[chat] ${d.from}: ${d.text}`));
      socket.on('disconnect', () => log('[socket] تم قطع الاتصال'));
    }

    document.getElementById('sendMsg').onclick = () => {
      const cmd = document.getElementById('cmd');
      if (!socket || !cmd.value) return;
      socket.emit('send', cmd.value);
      cmd.value = '';
    };
  </script>
</body>
</html>
