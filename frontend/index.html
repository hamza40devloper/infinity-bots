<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KeepAliveMC Pro — Bot Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #161922;
      --bg-tertiary: #1e212b;
      --bg-hover: #252a36;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2d3344;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Header */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .brand span { color: var(--text-muted); font-size: 12px; font-weight: 500; margin-left: 8px; }
    .connection-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--text-secondary);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s ease;
    }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .status-dot.offline { background: var(--error); box-shadow: 0 0 8px var(--error); }
    .status-dot.connecting { background: var(--warning); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Layout */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .card h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-group input::placeholder { color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--accent-glow); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; }

    .api-key-section { position: relative; }
    .api-key-section input { padding-right: 36px; }
    .toggle-key {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
    }

    /* Sessions List */
    .sessions-list { max-height: 300px; overflow-y: auto; }
    .session-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .session-item:hover { border-color: var(--accent); background: var(--bg-hover); }
    .session-item.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
    .session-item .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .session-item .session-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }
    .session-item .session-state {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .state-online { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .state-connecting { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .state-offline { background: rgba(239, 68, 68, 0.15); color: var(--error); }
    .state-stopped { background: rgba(100, 116, 139, 0.15); color: var(--text-muted); }
    .session-item .session-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    /* Main Content */
    .main { display: flex; flex-direction: column; gap: 16px; }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .stat-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      transition: transform 0.2s;
    }
    .stat-box:hover { transform: translateY(-2px); }
    .stat-box .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
    }
    .stat-box .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Console */
    .console-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 520px;
      box-shadow: var(--shadow);
    }
    .console-header {
      background: var(--bg-tertiary);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .console-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .console-actions { display: flex; gap: 8px; }
    .console-actions button {
      background: var(--bg-hover);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .console-actions button:hover { color: var(--text-primary); border-color: var(--accent); }

    #console {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-entry {
      margin-bottom: 4px;
      display: flex;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .log-ts { color: var(--text-muted); font-size: 11px; white-space: nowrap; user-select: none; }
    .log-type { font-size: 11px; padding: 0 6px; border-radius: 3px; font-weight: 500; text-transform: uppercase; min-width: 52px; text-align: center; }
    .log-type-system { background: rgba(59, 130, 246, 0.15); color: var(--info); }
    .log-type-success { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .log-type-error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
    .log-type-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
    .log-type-self { background: rgba(99, 102, 241, 0.15); color: var(--accent); }
    .log-type-chat { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
    .log-type-message { background: rgba(100, 116, 139, 0.15); color: var(--text-secondary); }
    .log-text { color: var(--text-primary); word-break: break-word; }

    .console-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border-top: 1px solid var(--border);
    }
    .console-input-row input {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
    }
    .console-input-row input:focus { border-color: var(--accent); }
    .console-input-row input::placeholder { color: var(--text-muted); }
    .console-input-row button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .console-input-row button:hover { background: var(--accent-hover); }
    .console-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 12px 16px;
      min-width: 280px;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.error { border-left-color: var(--error); }
    .toast.success { border-left-color: var(--success); }
    .toast.warning { border-left-color: var(--warning); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-fade { animation: fadeOut 0.3s ease forwards; }
    @keyframes fadeOut { to { transform: translateX(100%); opacity: 0; } }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state p { font-size: 14px; }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .console-card { height: 400px; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
<base target="_blank">
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">K</div>
      <h1>KeepAliveMC <span style="color:var(--accent)">Pro</span></h1>
    </div>
    <div class="connection-status">
      <span id="connText">Disconnected</span>
      <div id="connDot" class="status-dot offline"></div>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar">
      <!-- Spawn Form -->
      <div class="card">
        <h3>New Session</h3>
        <div class="form-group">
          <label>Server IP / Host</label>
          <input id="ip" placeholder="play.example.com" value="" />
        </div>
        <div class="form-group">
          <label>Port</label>
          <input id="port" type="number" value="25565" />
        </div>
        <div class="form-group">
          <label>Version</label>
          <select id="version">
            <option>1.8.9</option>
            <option>1.12.2</option>
            <option>1.16.5</option>
            <option>1.18.2</option>
            <option>1.19.4</option>
            <option selected>1.20.4</option>
            <option>1.20.6</option>
          </select>
        </div>
        <div class="form-group">
          <label>Username (optional)</label>
          <input id="username" placeholder="KeepAlive-Bot" />
        </div>
        <div class="form-group api-key-section">
          <label>API Key</label>
          <input id="apiKey" type="password" placeholder="your-secret-key" />
          <button class="toggle-key" onclick="toggleKey()">👁</button>
        </div>
        <button id="spawnBtn" class="btn btn-primary">Launch Bot</button>
      </div>

      <!-- Active Sessions -->
      <div class="card">
        <h3>Active Sessions <span id="sessionCount" style="color:var(--accent)">0</span></h3>
        <div id="sessionsList" class="sessions-list">
          <div class="empty-state">
            <p>No active sessions</p>
          </div>
        </div>
        <button id="refreshBtn" class="btn btn-sm" style="margin-top:10px;background:var(--bg-tertiary);color:var(--text-secondary);border:1px solid var(--border);">Refresh List</button>
      </div>
    </aside>

    <main class="main">
      <!-- Stats -->
      <div class="stats-bar" id="statsBar" style="display:none;">
        <div class="stat-box">
          <div class="stat-value" id="statHealth">--</div>
          <div class="stat-label">Health</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="statFood">--</div>
          <div class="stat-label">Food</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="statUptime">--</div>
          <div class="stat-label">Uptime</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="statPos">--</div>
          <div class="stat-label">Position</div>
        </div>
      </div>

      <!-- Console -->
      <div class="console-card">
        <div class="console-header">
          <h3>📡 Live Console <span id="sessionLabel" style="color:var(--text-muted);font-weight:400;"></span></h3>
          <div class="console-actions">
            <button onclick="copySessionId()">Copy ID</button>
            <button onclick="clearConsole()">Clear</button>
            <button id="stopBtn" class="btn btn-danger btn-sm" style="display:none;">Stop Bot</button>
          </div>
        </div>
        <div id="console">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 9l3 3-3 3m5 3h5M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p>Connect to a session to view the live console.<br>Use the sidebar to launch a new bot.</p>
          </div>
        </div>
        <div class="console-input-row">
          <input id="cmdInput" placeholder="Type message or /command... (Arrow Up/Down for history)" disabled />
          <button id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    // ─── Configuration ───────────────────────────────────────────────────────
    const API_BASE = 'https://keepalivemc-production.up.railway.app'; // ← REPLACE WITH YOUR BACKEND URL

    // ─── State ───────────────────────────────────────────────────────────────
    let currentSession = null;
    let socket = null;
    let commandHistory = [];
    let historyIndex = -1;
    let reconnectAttempts = 0;
    const MAX_RECONNECT = 5;
    let sessionsData = [];

    // ─── DOM ─────────────────────────────────────────────────────────────────
    const els = {
      ip: document.getElementById('ip'),
      port: document.getElementById('port'),
      version: document.getElementById('version'),
      username: document.getElementById('username'),
      apiKey: document.getElementById('apiKey'),
      spawnBtn: document.getElementById('spawnBtn'),
      stopBtn: document.getElementById('stopBtn'),
      sendBtn: document.getElementById('sendBtn'),
      cmdInput: document.getElementById('cmdInput'),
      console: document.getElementById('console'),
      connText: document.getElementById('connText'),
      connDot: document.getElementById('connDot'),
      sessionsList: document.getElementById('sessionsList'),
      sessionCount: document.getElementById('sessionCount'),
      refreshBtn: document.getElementById('refreshBtn'),
      statsBar: document.getElementById('statsBar'),
      sessionLabel: document.getElementById('sessionLabel'),
      toastContainer: document.getElementById('toastContainer'),
    };

    // ─── Helpers ─────────────────────────────────────────────────────────────
    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const h = Math.floor(m / 60);
      if (h > 0) return `${h}h ${m % 60}m`;
      if (m > 0) return `${m}m ${s % 60}s`;
      return `${s}s`;
    }
    function formatTs(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function showToast(msg, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${msg}</span>`;
      els.toastContainer.appendChild(toast);
      setTimeout(() => { toast.classList.add('toast-fade'); setTimeout(() => toast.remove(), 300); }, 4000);
    }
    function toggleKey() {
      els.apiKey.type = els.apiKey.type === 'password' ? 'text' : 'password';
    }

    // ─── Console ─────────────────────────────────────────────────────────────
    function clearConsole() {
      els.console.innerHTML = '';
    }
    function appendLog(entry) {
      if (els.console.querySelector('.empty-state')) els.console.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'log-entry';
      const typeClass = `log-type-${entry.type || 'message'}`;
      div.innerHTML = `
        <span class="log-ts">${formatTs(entry.ts || Date.now())}</span>
        <span class="log-type ${typeClass}">${entry.type || 'msg'}</span>
        <span class="log-text">${escapeHtml(entry.text)}</span>
      `;
      els.console.appendChild(div);
      els.console.scrollTop = els.console.scrollHeight;
    }
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ─── Connection Status ───────────────────────────────────────────────────
    function setStatus(state) {
      els.connDot.className = 'status-dot ' + state;
      els.connText.textContent = state === 'online' ? 'Connected' : state === 'connecting' ? 'Connecting...' : 'Disconnected';
    }

    // ─── Socket Management ───────────────────────────────────────────────────
    function connectSocket(sessionId) {
      if (socket) { socket.disconnect(); socket = null; }
      setStatus('connecting');

      socket = io(`${API_BASE}/session-${sessionId}`, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: MAX_RECONNECT,
        reconnectionDelay: 3000,
      });

      socket.on('connect', () => {
        setStatus('online');
        reconnectAttempts = 0;
        showToast('Connected to session console', 'success');
      });

      socket.on('log', (data) => {
        if (typeof data === 'string') {
          appendLog({ ts: Date.now(), type: 'message', text: data });
        } else {
          appendLog(data);
        }
      });

      socket.on('chat', (obj) => {
        appendLog({ ts: obj.ts || Date.now(), type: 'chat', text: `${obj.from}: ${obj.text}` });
      });

      socket.on('status', (status) => {
        if (status.state === 'online') {
          els.stopBtn.style.display = 'inline-flex';
          els.sendBtn.disabled = false;
          els.cmdInput.disabled = false;
        }
        appendLog({ ts: Date.now(), type: 'system', text: `Status changed to: ${status.state}` });
      });

      socket.on('stats', (stats) => {
        document.getElementById('statHealth').textContent = Math.round(stats.health || 0);
        document.getElementById('statFood').textContent = Math.round(stats.food || 0);
        if (stats.position) {
          const p = stats.position;
          document.getElementById('statPos').textContent = `${Math.round(p.x)}, ${Math.round(p.y)}, ${Math.round(p.z)}`;
        }
      });

      socket.on('disconnect', (reason) => {
        setStatus('offline');
        appendLog({ ts: Date.now(), type: 'warning', text: `Socket disconnected: ${reason}` });
        els.sendBtn.disabled = true;
        els.cmdInput.disabled = true;
      });

      socket.on('connect_error', (err) => {
        reconnectAttempts++;
        appendLog({ ts: Date.now(), type: 'error', text: `Connection error (${reconnectAttempts}/${MAX_RECONNECT}): ${err.message}` });
        if (reconnectAttempts >= MAX_RECONNECT) {
          showToast('Max reconnection attempts reached. Please refresh.', 'error');
          socket.disconnect();
        }
      });
    }

    // ─── Session Actions ─────────────────────────────────────────────────────
    async function spawnBot() {
      const ip = els.ip.value.trim();
      const port = parseInt(els.port.value) || 25565;
      const version = els.version.value;
      const username = els.username.value.trim() || null;
      const key = els.apiKey.value.trim();

      if (!ip) return showToast('Server IP is required', 'error');
      if (!key) return showToast('API Key is required', 'error');

      els.spawnBtn.disabled = true;
      els.spawnBtn.textContent = 'Launching...';

      try {
        const res = await fetch(`${API_BASE}/api/spawn`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': key },
          body: JSON.stringify({ host: ip, port, version, username }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        currentSession = data.sessionId;
        els.sessionLabel.textContent = `• ${data.username} @ ${data.host}:${data.port}`;
        els.statsBar.style.display = 'grid';
        clearConsole();
        appendLog({ ts: Date.now(), type: 'success', text: `Session ${data.sessionId} started. Expires: ${new Date(data.expiresAt).toLocaleString()}` });
        connectSocket(data.sessionId);
        els.stopBtn.style.display = 'inline-flex';
        els.sendBtn.disabled = false;
        els.cmdInput.disabled = false;
        showToast('Bot launched successfully!', 'success');
        fetchSessions();
      } catch (err) {
        showToast('Launch failed: ' + err.message, 'error');
        appendLog({ ts: Date.now(), type: 'error', text: `Launch failed: ${err.message}` });
      } finally {
        els.spawnBtn.disabled = false;
        els.spawnBtn.textContent = 'Launch Bot';
      }
    }

    async function stopBot() {
      if (!currentSession) return;
      const key = els.apiKey.value.trim();
      if (!key) return showToast('API Key required', 'error');

      try {
        const res = await fetch(`${API_BASE}/api/stop/${currentSession}`, {
          method: 'POST',
          headers: { 'x-api-key': key },
        });
        if (!res.ok) throw new Error('Stop failed');
        showToast('Bot stopped', 'success');
        if (socket) socket.disconnect();
        currentSession = null;
        els.stopBtn.style.display = 'none';
        els.sendBtn.disabled = true;
        els.cmdInput.disabled = true;
        els.statsBar.style.display = 'none';
        els.sessionLabel.textContent = '';
        fetchSessions();
      } catch (err) {
        showToast('Stop failed: ' + err.message, 'error');
      }
    }

    async function fetchSessions() {
      const key = els.apiKey.value.trim();
      if (!key) return;
      try {
        const res = await fetch(`${API_BASE}/api/sessions`, { headers: { 'x-api-key': key } });
        const data = await res.json();
        sessionsData = data.sessions || [];
        renderSessions();
      } catch (err) {
        console.error('Failed to fetch sessions', err);
      }
    }

    function renderSessions() {
      els.sessionCount.textContent = sessionsData.length;
      if (sessionsData.length === 0) {
        els.sessionsList.innerHTML = '<div class="empty-state"><p>No active sessions</p></div>';
        return;
      }
      els.sessionsList.innerHTML = sessionsData.map(s => `
        <div class="session-item ${s.id === currentSession ? 'active' : ''}" data-id="${s.id}">
          <div class="session-header">
            <span class="session-id">${s.id.slice(0, 8)}...</span>
            <span class="session-state state-${s.state}">${s.state}</span>
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${s.info.username} @ ${s.info.host}</div>
          <div class="session-meta">
            <span>⏱ ${formatTime(s.uptime || 0)}</span>
            <span>🔄 ${s.reconnectCount || 0}</span>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.session-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          if (id === currentSession) return;
          currentSession = id;
          const s = sessionsData.find(x => x.id === id);
          if (s) {
            els.sessionLabel.textContent = `• ${s.info.username} @ ${s.info.host}:${s.info.port}`;
            els.statsBar.style.display = 'grid';
          }
          clearConsole();
          connectSocket(id);
          els.stopBtn.style.display = 'inline-flex';
          els.sendBtn.disabled = false;
          els.cmdInput.disabled = false;
          renderSessions();
        });
      });
    }

    function copySessionId() {
      if (!currentSession) return showToast('No active session', 'error');
      navigator.clipboard.writeText(currentSession).then(() => showToast('Session ID copied!', 'success'));
    }

    function sendCommand() {
      const msg = els.cmdInput.value.trim();
      if (!msg || !socket) return;
      socket.emit('send', msg);
      commandHistory.push(msg);
      historyIndex = commandHistory.length;
      els.cmdInput.value = '';
    }

    // ─── Event Listeners ─────────────────────────────────────────────────────
    els.spawnBtn.addEventListener('click', spawnBot);
    els.stopBtn.addEventListener('click', stopBot);
    els.sendBtn.addEventListener('click', sendCommand);
    els.refreshBtn.addEventListener('click', fetchSessions);

    els.cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendCommand();
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (historyIndex > 0) {
          historyIndex--;
          els.cmdInput.value = commandHistory[historyIndex];
        }
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          els.cmdInput.value = commandHistory[historyIndex];
        } else {
          historyIndex = commandHistory.length;
          els.cmdInput.value = '';
        }
      }
    });

    // Auto-refresh sessions every 10s
    setInterval(fetchSessions, 10000);

    // Initial
    showToast('KeepAliveMC Pro loaded. Enter your API key to begin.', 'info');
  </script>
</body>
</html>
